<meta charset="utf-8">
<style>

    --green:#1f9254; --green-bg:#e8f6ee; --red:#c0392b; --red-bg:#fdecea;

  .chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:4px 11px;font-size:11px;white-space:nowrap}
  .chip.green{background:#1f9254;border-color:#1f9254}
  .chip.role{background:#6b46c1;border-color:#6b46c1}
  .btn-logout{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;font-size:11px;padding:4px 12px}

  .tabbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tab{background:#eef1f5;color:#41506b;border:1px solid var(--line);font-weight:600}
  .tab.active{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}

  .spacer{margin-left:auto;display:flex;gap:8px}
  .btn-primary{background:var(--navy-2);color:#fff}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-danger{background:#c0392b;color:#fff}
  .btn-ok{background:#1f9254;color:#fff}

  .notice{background:var(--blue-bg);border:1px solid #cbdff5;border-radius:var(--radius);padding:9px 12px;margin-bottom:12px;font-size:12px;color:#28456e}
  .notice.warn{background:var(--amber-bg);border-color:#f2dfb8;color:#7a5410}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
  .kcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--grey);border-radius:var(--radius);padding:11px 13px}
  .kcard .lbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kcard .val{font-size:26px;font-weight:700;margin:4px 0 2px}

  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);background:#fff;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:22px;height:11px;border-radius:3px;border:1px solid var(--line);margin-right:5px;vertical-align:-2px;font-style:normal}
  .datefilter{display:flex;align-items:center;gap:5px;font-size:12px;color:#41506b;white-space:nowrap}
  .datefilter input{width:auto;min-width:0;padding:6px 7px;font-size:12px}

  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .empty{padding:26px;text-align:center;color:var(--muted)}

  .b-grey{background:var(--grey-bg);color:#4a5a70;border-color:#dfe4ea}
  .b-blue{background:var(--blue-bg);color:var(--blue);border-color:#cbdff5}
  .b-amber{background:var(--amber-bg);color:var(--amber);border-color:#f2dfb8}
  .b-green{background:var(--green-bg);color:var(--green);border-color:#c4e6d3}
  .b-purple{background:var(--purple-bg);color:var(--purple);border-color:#ddd2f5}
  .b-red{background:var(--red-bg);color:var(--red);border-color:#f5cfca}
  .newbar{margin-bottom:12px}
  .btn-new{background:var(--navy-2);color:#fff;font-size:16px;font-weight:700;padding:15px 30px;border-radius:8px;

  .rowbtn.ok{border-color:#c4e6d3;background:var(--green-bg);color:var(--green);font-weight:700}
  .rowbtn.no{border-color:#f5cfca;background:var(--red-bg);color:var(--red);font-weight:700}
  .stock-warn{color:var(--red);font-weight:700}
  .late{color:var(--red);font-weight:700}

  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:8px;width:100%;max-width:900px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h3{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:11px 15px;font-size:14px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:10px}
  .modal h3 .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:18px;line-height:1;padding:0 4px}
  .robar{padding:9px 15px;background:var(--grey-bg);border-bottom:1px solid var(--line);font-size:11.5px;color:#4a5a70}
  .form{padding:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:11px;font-weight:700;color:#41506b}
  .f .req{color:var(--red)}
  .f.span2{grid-column:span 2}.f.span4{grid-column:span 4}
  .f .calc{background:#f4f6f9;border:1px dashed #c8d3e0;border-radius:var(--radius);padding:7px 9px;font-weight:700;font-variant-numeric:tabular-nums}
  .f .ro{background:#fafbfd;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;min-height:33px;white-space:pre-wrap;word-break:break-word}
  .f .err{font-size:10px;color:var(--red);font-weight:600}
  .f.invalid input,.f.invalid select,.f.invalid textarea{border-color:var(--red);background:#fff8f7}
  .modal .foot{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#fafbfd;border-radius:0 0 8px 8px;flex-wrap:wrap}
  .modal .foot .msg{font-size:12px;color:var(--red);font-weight:600}
  .modal .foot .r{margin-left:auto;display:flex;gap:8px}
  .hist{padding:0 15px 12px;font-size:11px;color:var(--muted)}
  .hist div{padding:3px 0;border-top:1px dotted var(--line)}

  .dlg-wrap{position:fixed;inset:0;background:rgba(12,26,48,.6);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}

  .dlg .c input{margin-top:9px}
  .dlg .b{padding:12px 15px;border-top:1px solid var(--line);background:#fafbfd;display:flex;gap:8px;justify-content:flex-end}
  .toast{position:fixed;right:16px;bottom:16px;z-index:90;background:#16233a;color:#fff;border-radius:8px;padding:11px 15px;font-size:12.5px;

  .toast.ok{background:#1f9254}
  .banner{background:var(--red-bg);border:1px solid #f5cfca;border-left:4px solid var(--red);color:#8c2f22;

  .login{background:#fff;border-radius:10px;width:350px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .login h2{margin:0 0 3px;font-size:17px}
  .login p.s{margin:0 0 16px;font-size:11px;color:var(--muted)}
  .login .f{margin-bottom:11px}
  .login button{width:100%;padding:9px}
  .login .hint{margin-top:13px;font-size:10.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
  .login .hint b{color:#41506b}
  .loginerr{background:var(--red-bg);border:1px solid #f5cfca;color:var(--red);font-size:11px;padding:7px 9px;border-radius:var(--radius);margin-bottom:11px;font-weight:600}

  .admgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .adm table{white-space:normal}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .tag{background:var(--blue-bg);border:1px solid #cbdff5;color:#28456e;border-radius:20px;padding:3px 6px 3px 10px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
  .tag button{background:transparent;border:0;color:#7b8ba3;padding:0 3px;font-size:13px;line-height:1}
  .inline{display:flex;gap:7px;align-items:center}
  .inline input,.inline select{width:auto;flex:1}
  .switch{display:flex;align-items:center;justify-content:center}
  .secbox{border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px;margin-bottom:9px;background:#fafbfd}
  .sechead{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
  .atts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .att{display:flex;align-items:center;gap:6px;background:var(--blue-bg);border:1px solid #cbdff5;border-radius:20px;padding:3px 5px 3px 10px;font-size:11px}
  .att .open{background:transparent;border:0;color:#28456e;font-weight:600;padding:0;font-size:11px;text-decoration:underline}
  .att .rm{background:transparent;border:0;color:#7b8ba3;padding:0 3px;font-size:13px;line-height:1}
  .att .sz{color:var(--muted)}
  .filebtn{border:1px dashed #c8d3e0;background:#fafbfd;border-radius:var(--radius);padding:6px 9px;font-size:11.5px;color:#41506b;cursor:pointer}
  .filebtn input{display:none}
  .clip{color:#2563a8;font-weight:700;font-size:11px}
  .autohint{font-size:10.5px;color:#1f9254;font-weight:600;margin-top:2px}
  .autohint.grey{color:var(--muted);font-weight:500}
  .rolebox{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;margin-bottom:8px;background:#fafbfd}
  .rolebox b{font-size:12px}
  .rolebox p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
  @media(max-width:900px){.form{grid-template-columns:repeat(2,1fr)}.f.span4{grid-column:span 2}.admgrid{grid-template-columns:1fr}}
</style>

/* ---------- úložiště: SDÍLENÉ pro všechny, kdo mají odkaz ---------- */
const KEY='np:state:v2', OLDKEY='np:state:v1';
async function load(){
  try{ const r = await window.storage.get(KEY, true); if(r && r.value) return migrate(JSON.parse(r.value)); }catch(e){}
  try{ const o = await window.storage.get(OLDKEY, false); if(o && o.value){ const m = migrate(JSON.parse(o.value)); syncNote='Data z předchozí verze byla převzata a jsou nyní sdílená s celým týmem.'; return m; } }catch(e){}
  return migrate(JSON.parse(JSON.stringify(DEFAULT_STATE)));
}
async function save(){
  try{ await window.storage.set(KEY, JSON.stringify(S), true); storageOk=true; }
  catch(e){ storageOk=false; toast('Změna se NEULOŽILA — ostatní ji neuvidí. Viz červené upozornění nahoře.','err'); }
}
/* zkouška zápisu: bez účtu Claude (Pro a výš) nebo u nepublikovaného artefaktu úložiště tiše selže */
async function ping(){
  try{ await window.storage.set('np:ping', String(Date.now()), true); storageOk=true; }
  catch(e){ storageOk=false; }
}
async function reload(){ S = await load(); }

/* doplní novinky do starších dat, aniž by cokoli přepsal */
function migrate(st){
  const d = DEFAULT_STATE;
  st.rates = st.rates || d.rates;
  st.accounts = (st.accounts && st.accounts.length ? st.accounts : JSON.parse(JSON.stringify(d.accounts)))
    .map(a=>typeof a==='string' ? {code:a, name:(d.accounts.find(x=>x.code===a)||{}).name || ''} : a);
  st.sections = st.sections && st.sections.length ? st.sections : JSON.parse(JSON.stringify(d.sections));
  st.fields = st.fields || [];
  d.fields.forEach(f=>{ if(!st.fields.some(x=>x.id===f.id)) st.fields.push(JSON.parse(JSON.stringify(f))); });
  st.fields = st.fields.filter(f=>f.id!=='poradove');
  st.users = st.users || [];
  d.users.forEach(u=>{ if(!st.users.some(x=>x.login===u.login)) st.users.push(JSON.parse(JSON.stringify(u))); });
  st.users.forEach(u=>{ if(!ROLES[u.role]) u.role='zadavatel'; });
  st.rows = (st.rows||[]).map(r=>Object.assign({datum:'',usek:'',stroj:'',atts:[],approvedBy:null,approvedAt:null,hist:[]}, r));
  st.seq = st.seq || st.rows.length;
  return st;
}

const num = (v,d=2)=>(isFinite(v)?Number(v):0).toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d});
const badge = (v,defs)=>{const d=defs.find(x=>x.k===v);return `<span class="badge ${d?d.cls:'b-grey'}">${esc(v||'—')}</span>`;};
const total = r => (Number(r.cena)||0)*(Number(r.mnozstvi)||0);
const totalEur = r => r.mena==='EUR'?total(r):total(r)/(S.rates[r.mena]||1);
const fld = id => S.fields.find(f=>f.id===id)||{label:id,req:false};
const today = () => new Date().toISOString().slice(0,10);
const dateCz = d => d ? d.split('-').reverse().map(x=>String(Number(x))).join('. ')+'.' : '—';
const makeNo = () => 'NP-'+new Date().getFullYear()+'-'+String(S.seq).padStart(3,'0');
const uname = l => (S.users.find(u=>u.login===l)||{}).name || l;
const acc = c => S.accounts.find(a=>a.code===c);
const accName = c => (acc(c)||{}).name || '';
const accLabel = c => c ? (accName(c) ? c+' — '+accName(c) : c) : '';

function dlgView(){
  if(!dlg) return '';
  return `<div class="dlg-wrap"><div class="dlg">
    <div class="t">${esc(dlg.title)}</div>
    <div class="c">${esc(dlg.text)}

function toastView(){ return toastMsg?`<div class="toast ${toastKind}">${esc(toastMsg)}</div>`:''; }
function toast(msg,kind=''){
  toastMsg=msg; toastKind=kind;
  clearTimeout(toast._t);
  // vykreslíme jen bublinu, ať překreslení nesmaže rozepsaný text ve formuláři
  const host=document.getElementById('app');
  if(host){ let n=document.getElementById('toast-node'); if(!n){ n=document.createElement('div'); n.id='toast-node'; host.appendChild(n);} n.innerHTML=`<div class="toast ${kind}">${esc(msg)}</div>`; }
  toast._t=setTimeout(()=>{ toastMsg=null; const n=document.getElementById('toast-node'); if(n) n.innerHTML=''; },4500);
}
function ask(opts){
  return new Promise(res=>{ dlg=Object.assign({kind:'confirm',title:'Potvrzení',ok:'Potvrdit'},opts,{resolve:res}); render(); });
}
const askYes  = (text,o={}) => ask(Object.assign({text},o));
const askText = (text,o={}) => ask(Object.assign({text,kind:'prompt',ok:'Odeslat'},o));
const info    = (text,o={}) => ask(Object.assign({text,kind:'info',title:'Informace',ok:'Rozumím'},o));

/* ---------- seznam ---------- */
function visibleRows(){
  let r=S.rows.slice();
  if(filters.mine) r=r.filter(x=>x.author===me.login);
  if(filters.status) r=r.filter(x=>x.status===filters.status);
  if(filters.priorita) r=r.filter(x=>x.priorita===filters.priorita);
  if(filters.ucet) r=r.filter(x=>x.ucet===filters.ucet);
  if(filters.usek) r=r.filter(x=>x.usek===filters.usek);
  if(filters.od) r=r.filter(x=>(x.created||'')>=filters.od);
  if(filters.do) r=r.filter(x=>(x.created||'')<=filters.do);
  if(filters.q){const q=filters.q.toLowerCase();
    r=r.filter(x=>[x.poradove,x.sklad,x.popis,x.vyrobce,x.poznamka].join(' ').toLowerCase().includes(q));}
  const c=sort.col;
  r.sort((a,b)=>{
    let x=c==='celkem'?totalEur(a):a[c], y=c==='celkem'?totalEur(b):b[c];
    if(typeof x==='number'||typeof y==='number') return ((x||0)-(y||0))*sort.dir;
    return String(x??'').localeCompare(String(y??''),'cs')*sort.dir;
  });
  return r;
}

function roleNotice(){
  if(P().admin) return `<div class="notice">Máš plná práva. Povinná pole, uživatele a účty spravuješ v záložce Administrace.</div>`;
  if(me.role==='skladnik') return `<div class="notice">Jako skladník měníš stav požadavků, datum dodání, účet i ostatní údaje. ${toAskGlobal()?`<b>${toAskGlobal()} nových požadavků nemá cenu — popt(ej) je u dodavatele</b> tlačítkem Poptat v tabulce.`:'Doplníš-li cenu, požadavek se sám posune ke schválení.'}</div>`;
  if(me.role==='schvalovatel') return `<div class="notice">Otevři požadavek a odklikni <b>Schválit</b> nebo <b>Zamítnout</b>. Stačí schválení jednoho ze schvalovatelů — schválit můžeš i požadavek, který zatím nemá cenu. Ostatní údaje upravuje sklad.</div>`;

}

/* Pravidlo: požadavek s doplněnou cenou putuje sám ke schválení.
   Ruční volbu skladníka nepřebíjíme — auto se pustí jen když stav nechal beze změny. */
const AUTO_FROM = ['nový','poptáno'];
function applyAutoStatus(row, oldStatus, statusTouched){
  if(row.approvedBy) return null;
  if(statusTouched) return null;
  if((Number(row.cena)||0) > 0 && AUTO_FROM.includes(row.status)){
    row.status='ve schvalování';
    return `stav ${oldStatus} → ve schvalování (automaticky po doplnění ceny)`;
  }
  return null;
}

/* pod-úseky se plní podle vybraného úseku; bez úseku je výběr prázdný */
function machineSelect(r){
  const sec = S.sections.find(x=>x.name===r.usek);
  const ms = sec ? sec.machines : [];
  if(!sec) return `<select id="e-stroj" disabled><option value="">nejdřív vyber úsek</option></select>`;
  if(!ms.length) return `<select id="e-stroj" disabled><option value="">úsek nemá stroje</option></select>`;
  return `<select id="e-stroj"><option value="">— celý úsek (bez stroje) —</option>${ms.map(m=>`<option ${r.stroj===m?'selected':''}>${esc(m)}</option>`).join('')}</select>`;
}

/* ---------- formulář ---------- */
function collect(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
  const set={status:g('e-status'),poradove:g('e-poradove'),sklad:g('e-sklad'),popis:g('e-popis'),priorita:g('e-priorita'),
    mnozstvi:Number(g('e-mnozstvi'))||0,cena:Number(g('e-cena'))||0,mena:g('e-mena'),vyrobce:g('e-vyrobce'),
    ucet:g('e-ucet'),usek:g('e-usek'),stroj:g('e-stroj'),datum:g('e-datum'),min:Number(g('e-min'))||0,max:Number(g('e-max'))||0,url:g('e-url'),poznamka:g('e-poznamka')};
  Object.keys(set).forEach(k=>{ if(set[k]!==undefined) editing[k]=set[k]; });
}
function recalc(){
  collect();
  const t=document.getElementById('c-total'),e=document.getElementById('c-eur');
  if(t) t.textContent=num(total(editing))+' '+editing.mena;
  if(e) e.textContent=num(totalEur(editing))+' €';
  const h=document.getElementById('auto-hint');
  if(h){
    const has=(Number(editing.cena)||0)>0;
    h.className='autohint '+(has?'':'grey');
    h.textContent=has?'Cena je vyplněná → po odeslání půjde rovnou ke schválení.':'Bez ceny — sklad požadavek poptá u dodavatele.';
  }
}
function validate(){
  errs={};
  const empty=v=>v===''||v===null||v===undefined||(typeof v==='number'&&v===0);
  S.fields.forEach(f=>{ if(f.req && empty(editing[f.id])) errs[f.id]='Povinné pole'; });
  if(editing.url && !/^https?:\/\//i.test(editing.url)) errs.url='Odkaz musí začínat http:// nebo https://';
  if(editing.min&&editing.max&&Number(editing.min)>Number(editing.max)) errs.max='MAX musí být ≥ MIN';
  return Object.keys(errs).length===0;
}

/* ---------- přílohy ---------- */
const ATT='np:att:';
const kb = b => b>1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' kB';
const icon = t => t==='application/pdf' ? '📄' : '🖼';

function attList(r, editable){
  const list=(r.atts||[]);
  if(!list.length && !editable) return '<span class="muted">—</span>';
  return list.map(a=>`<span class="att">${icon(a.type)}
    <button class="open" data-a="att-open" data-v="${a.id}" title="Otevřít v nové záložce">${esc(a.name)}</button>
    <span class="sz">${kb(a.size)}</span>
    ${editable?`<button class="rm" data-a="att-del" data-v="${a.id}" title="Odebrat">✕</button>`:''}</span>`).join('');
}

function b64ToBlob(dataUrl, type){
  const b64 = dataUrl.split(',')[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type});
}

async function attachFile(file){
  const MAX=1.5*1024*1024;
  if(!['application/pdf','image/jpeg','image/png'].includes(file.type)){ toast('Přijímám jen PDF, JPG nebo PNG.','err'); return; }
  if(file.size>MAX){ toast(`Soubor má ${kb(file.size)} — limit je 1,5 MB. Zmenši výstřižek nebo přilož jen potřebnou stránku.`,'err'); return; }
  const data = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error('čtení souboru selhalo')); fr.readAsDataURL(file); });
  const id = 'a'+Date.now()+Math.floor(Math.random()*1000);
  try{ await window.storage.set(ATT+id, JSON.stringify({name:file.name,type:file.type,data}), true); }
  catch(e){ toast('Přílohu se nepodařilo uložit — nejspíš je moc velká, nebo nemáš oprávnění k ukládání.','err'); return; }
  editing.atts = editing.atts||[];
  editing.atts.push({id, name:file.name, type:file.type, size:file.size, by:me.name, at:today()});
}

async function openAtt(id){
  try{
    const r = await window.storage.get(ATT+id, true);
    if(!r||!r.value){ toast('Příloha se nenašla — možná ji někdo odebral.','err'); return; }
    const f = JSON.parse(r.value);
    const url = URL.createObjectURL(b64ToBlob(f.data, f.type));
    const w = window.open(url,'_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download=f.name; a.click(); }
  }catch(e){ toast('Přílohu se nepodařilo otevřít.','err'); }
}

function bind(){
  document.querySelectorAll('[data-a]').forEach(el=>{
    const a=el.dataset.a,v=el.dataset.v;
    if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='file'||(el.tagName==='INPUT'&&a==='acc-name')) el.onchange=ev=>act(a,v,el,ev);
    else el.onclick=ev=>{ev.stopPropagation();act(a,v,el,ev);};
  });
  const q=document.getElementById('f-q');
  if(q) q.oninput=()=>{filters.q=q.value;const p=q.selectionStart;render();const n=document.getElementById('f-q');n.focus();n.setSelectionRange(p,p);};
  ['status','priorita','ucet','usek','od','do'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)el.onchange=()=>{filters[k]=el.value;render();};});
  const m=document.getElementById('f-mine');if(m)m.onchange=()=>{filters.mine=m.checked;render();};
  ['e-cena','e-mnozstvi','e-mena'].forEach(id=>{const el=document.getElementById(id);if(el){el.oninput=recalc;el.onchange=recalc;}});
  document.querySelectorAll('input[data-draft]').forEach(el=>{ el.oninput=()=>{ drafts[el.dataset.draft]=el.value; }; });
  const us=document.getElementById('e-usek');
  if(us) us.onchange=()=>{collect();editing.stroj='';render();};
  const lp=document.getElementById('lg-pass');if(lp)lp.onkeydown=e=>{if(e.key==='Enter')act('login');};
}

async function act(a,v,el,ev){
  switch(a){
    case 'login':{
      const u=(document.getElementById('lg-user').value||'').trim().toLowerCase();
      const p=document.getElementById('lg-pass').value||'';
      const f=S.users.find(x=>x.login===u&&x.pass===p);
      if(!f){loginErr='Nesprávné jméno nebo heslo. Zkus to znovu.';render();return;}
      me=f;loginErr='';tab='pozadavky';break;
    }
    case 'logout': me=null; break;
    case 'dlg-yes':{
      const d=dlg; dlg=null;
      const val = d.kind==='prompt' ? (document.getElementById('dlg-input')||{}).value||'' : true;
      render(); d.resolve(d.kind==='prompt'?val:true); return;
    }
    case 'dlg-no':{ const d=dlg; dlg=null; render(); d.resolve(d.kind==='prompt'?null:false); return; }
    case 'tab': tab=v; break;
    case 'clear-filters': filters={q:'',status:'',priorita:'',ucet:'',usek:'',od:'',do:'',mine:false}; break;
    case 'sort': sort=(sort.col===v)?{col:v,dir:-sort.dir}:{col:v,dir:1}; break;
    case 'refresh': await reload(); me=S.users.find(u=>u.login===me.login)||me; syncNote=''; break;

    case 'new':
      editing={status:'nový',poradove:'',sklad:'',popis:'',priorita:'běžná',mnozstvi:1,cena:0,mena:'CZK',
               vyrobce:'',ucet:'',usek:'',stroj:'',datum:'',atts:[],min:0,max:0,url:'',poznamka:'',author:me.login,created:today(),
               approvedBy:null,approvedAt:null,hist:[]};
      errs={};footMsg='';break;

    case 'open': editing=JSON.parse(JSON.stringify(S.rows.find(r=>r.id==v)));errs={};footMsg='';break;

    case 'dup':{
      const s=S.rows.find(r=>r.id==v);
      editing=Object.assign(JSON.parse(JSON.stringify(s)),{id:null,poradove:'',status:'nový',author:me.login,
        created:today(),datum:'',atts:[],approvedBy:null,approvedAt:null,hist:[]});
      errs={};footMsg='';break;
    }

    case 'del':{
      if(!P().del) return;
      const r=S.rows.find(x=>x.id==v);
      if(await askYes(`Smazat požadavek ${r.poradove}? Tohle nejde vrátit.`,{title:'Smazání požadavku',ok:'Smazat',danger:true})){
        S.rows=S.rows.filter(x=>x.id!=v); await save(); toast('Požadavek '+r.poradove+' smazán.','ok');
      }
      break;
    }

    case 'approve':{
      if(!P().approve) return;
      const r=S.rows.find(x=>x.id==v);
      if(r.approvedBy){ await info('Požadavek už schválil '+r.approvedBy+'.'); return; }
      if(!await askYes(`Schválit požadavek ${r.poradove} za sebe? Stačí schválení jednoho ze schvalovatelů.`,
          {title:'Schválení požadavku',ok:'✔ Schválit'})) return;
      r.approvedBy=me.name; r.approvedAt=today();
      if(['nový','ve schvalování','poptáno'].includes(r.status)) r.status='schváleno';
      r.hist.push(`${today()} · ${me.name} · schválil požadavek`);
      editing=null; await save();
      if(storageOk) toast('Požadavek '+r.poradove+' schválen.','ok');
      break;
    }

    case 'reject':{
      if(!P().approve) return;
      const r=S.rows.find(x=>x.id==v);
      const d=await askText(`Zamítnutí požadavku ${r.poradove}. Napiš důvod — uvidí ho zadavatel i sklad:`,
        {title:'Zamítnutí požadavku',ok:'✕ Zamítnout',danger:true,placeholder:'např. objednáno jinou cestou'});
      if(d===null) return;
      r.status='zamítnuto'; r.approvedBy=null; r.approvedAt=null;
      r.hist.push(`${today()} · ${me.name} · zamítl požadavek${d?': '+d:''}`);
      if(d) r.poznamka=(r.poznamka?r.poznamka+' | ':'')+'Zamítnuto: '+d;
      editing=null; await save();
      if(storageOk) toast('Požadavek '+r.poradove+' zamítnut.','ok');
      break;
    }

    case 'save':{
      const isNew=!editing.id;
      if(!canEditRow(isNew)) return;
      collect();
      if(isNew && !P().edit) editing.status='nový';
      if(!validate()){footMsg='Doplň povinná pole označená červeně.';render();return;}
      if(isNew){
        S.seq++; editing.poradove=makeNo(); editing.id=Date.now()+Math.floor(Math.random()*1000);
        editing.hist=[`${today()} · ${me.name} · založil požadavek${(editing.atts||[]).length?' ('+editing.atts.length+' příloh)':''}`];
        const auto=applyAutoStatus(editing,'nový',false);
        if(auto) editing.hist.push(`${today()} · systém · ${auto}`);
        S.rows.push(editing);
      }else{
        const old=S.rows.find(r=>r.id===editing.id);
        const touched = old.status!==editing.status;
        if(touched) editing.hist.push(`${today()} · ${me.name} · stav ${old.status} → ${editing.status}`);
        else editing.hist.push(`${today()} · ${me.name} · upravil požadavek`);
        if(!touched && (Number(old.cena)||0)===0 && (Number(editing.cena)||0)>0){
          const auto=applyAutoStatus(editing,old.status,false);
          if(auto) editing.hist.push(`${today()} · ${me.name} · ${auto}`);
        }
        S.rows=S.rows.map(r=>r.id===editing.id?editing:r);
      }
      const savedNo=editing.poradove;
      editing=null;footMsg='';await save();
      if(storageOk) toast(isNew?('Požadavek '+savedNo+' založen.'):'Změny uloženy.','ok');
      break;
    }

    case 'close': case 'close-bg':
      if(a==='close-bg'&&ev&&ev.target!==el) return;
      editing=null;errs={};footMsg='';break;

    case 'attach':{
      const f = el.files && el.files[0]; if(!f) return;
      collect(); await attachFile(f);
      editing.hist = editing.hist||[];
      break;
    }
    case 'att-open': await openAtt(v); return;
    case 'att-del':{
      const a2 = editing.atts.find(x=>x.id===v);
      if(!await askYes('Odebrat přílohu '+a2.name+'?',{title:'Odebrání přílohy',ok:'Odebrat',danger:true})) return;
      collect();
      editing.atts = editing.atts.filter(x=>x.id!==v);
      try{ await window.storage.delete(ATT+v, true); }catch(e){}
      break;
    }

    case 'poptat':{
      if(!P().edit) return;
      const r=S.rows.find(x=>x.id==v);
      r.status='poptáno';
      r.hist.push(`${today()} · ${me.name} · stav nový → poptáno (poptávka u dodavatele)`);
      await save(); break;
    }

    case 'export':{
      const head=['Stav','Pořadové číslo','Skladové číslo','Popis','Priorita','Množství','Cena/ks','Měna','Cena celkem','Cena EUR','Výrobce','Účet','Popis účtu','Úsek','Stroj / pod-úsek','Datum dodání','MIN','MAX','URL','Poznámka','Přílohy','Zadal','Vytvořeno','Schválil','Schváleno dne'];
      const lines=[head.join(';')].concat(visibleRows().map(r=>[r.status,r.poradove,r.sklad,r.popis,r.priorita,r.mnozstvi,r.cena,r.mena,total(r).toFixed(2),totalEur(r).toFixed(2),r.vyrobce,r.ucet,accName(r.ucet),r.usek,r.stroj,r.datum,r.min,r.max,r.url,r.poznamka,(r.atts||[]).length,uname(r.author),r.created,r.approvedBy||'',r.approvedAt||'']
        .map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')));
      const b=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv'});
      const a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='nakupni_pozadavky.csv';a2.click();
      return;
    }

    /* --- administrace --- */
    case 'req':{ if(!P().admin)return; fld(v).req=el.checked; await save(); return; }
    case 'add-acc':{
      if(!P().admin)return;
      const code=(drafts['new-acc']||document.getElementById('new-acc').value||'').trim();
      const nm=(drafts['new-acc-name']||document.getElementById('new-acc-name').value||'').trim();
      if(!code){ toast('Vyplň číslo účtu.','err'); return; }
      if(S.accounts.some(a=>a.code===code)){ toast('Účet '+code+' už v seznamu je.','err'); return; }
      S.accounts.push({code, name:nm});
      S.accounts.sort((a,b)=>a.code.localeCompare(b.code,'cs',{numeric:true}));
      delete drafts['new-acc']; delete drafts['new-acc-name'];
      await save();break;
    }
    case 'acc-name':{ if(!P().admin)return; acc(v).name=el.value.trim(); await save(); return; }
    case 'add-sec':{
      if(!P().admin)return;
      const n=(drafts['new-sec']||document.getElementById('new-sec').value||'').trim();
      if(!n)return;
      delete drafts['new-sec'];
      if(S.sections.some(x=>x.name.toLowerCase()===n.toLowerCase())){ toast('Úsek už existuje.','err'); return; }
      S.sections.push({name:n,machines:[]});await save();break;
    }
    case 'del-sec':{
      if(!P().admin)return;
      const used=S.rows.filter(r=>r.usek===v).length;
      if(!await askYes(used?`Úsek ${v} je použitý u ${used} požadavků — ty zůstanou, jen zmizí z nabídky.`:`Odebrat úsek ${v}?`,
        {title:'Odebrání úseku',ok:'Odebrat',danger:true})) return;
      S.sections=S.sections.filter(x=>x.name!==v);await save();break;
    }
    case 'add-mach':{
      if(!P().admin)return;
      const [sn,i]=v.split('|');
      const m=(drafts['m-'+sn]||(document.getElementById('m-'+i)||{}).value||'').trim();
      if(!m)return;
      const sec=S.sections.find(x=>x.name===sn);
      delete drafts['m-'+sn];
      if(sec.machines.some(x=>x.toLowerCase()===m.toLowerCase())){ toast('Stroj už v úseku je.','err'); return; }
      sec.machines.push(m);sec.machines.sort((a,b)=>a.localeCompare(b,'cs',{numeric:true}));await save();break;
    }
    case 'del-mach':{
      if(!P().admin)return;
      const [sn,m]=v.split('|');
      const sec=S.sections.find(x=>x.name===sn);
      sec.machines=sec.machines.filter(x=>x!==m);await save();break;
    }
    case 'del-acc':{
      if(!P().admin)return;
      const used=S.rows.filter(r=>r.ucet===v).length;
      if(!await askYes(used?`Účet ${v} je použitý u ${used} požadavků — u nich zůstane, jen zmizí z nabídky.`:`Odebrat účet ${v}?`,
        {title:'Odebrání účtu',ok:'Odebrat',danger:true})) return;
      S.accounts=S.accounts.filter(x=>x.code!==v); await save(); break;
    }
    case 'role':{ if(!P().admin)return; S.users.find(u=>u.login===v).role=el.value; await save(); return; }
    case 'del-user':{
      if(!P().admin)return;
      if(S.rows.some(r=>r.author===v)){ await info('Uživatel má zadané požadavky, nelze ho odebrat. Nejdřív požadavky přepiš nebo smaž.'); return; }
      S.users=S.users.filter(u=>u.login!==v);await save();break;
    }
    case 'add-user':{
      if(!P().admin)return;
      const g=id=>(document.getElementById(id).value||'').trim();
      const login=g('u-login').toLowerCase();
      if(!g('u-name')||!login||!g('u-pass')){ toast('Vyplň jméno, login i heslo.','err'); return; }
      if(S.users.some(u=>u.login===login)){ toast('Login už existuje.','err'); return; }
      S.users.push({login,pass:g('u-pass'),name:g('u-name'),team:g('u-team')||'—',role:document.getElementById('u-role').value});
      await save();break;
    }
    case 'save-rates':{
      if(!P().admin)return;
      S.rates.CZK=Number(document.getElementById('r-czk').value)||S.rates.CZK;
      S.rates.USD=Number(document.getElementById('r-usd').value)||S.rates.USD;
      await save();break;
    }
    case 'backup':{
      const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a3=document.createElement('a');a3.href=URL.createObjectURL(b);a3.download='nakupni_pozadavky_zaloha_'+today()+'.json';a3.click();
      return;
    }
    case 'copy-backup':{
      const t=JSON.stringify(S);
      try{ await navigator.clipboard.writeText(t); toast('Záloha je ve schránce.','ok'); }
      catch(e){ const ta=document.getElementById('restore-json'); ta.value=t; ta.select(); toast('Schránka není dostupná — záloha je v poli níže, zkopíruj ji ručně.','err'); }
      return;
    }
    case 'restore':{
      if(!P().admin)return;
      const raw=(document.getElementById('restore-json').value||'').trim();
      if(!raw){ toast('Vlož obsah zálohy.','err'); return; }
      let d;try{d=JSON.parse(raw);}catch(e){ toast('Text není platný JSON.','err'); return; }
      if(!d.rows||!d.users){ toast('Záloha neobsahuje požadavky ani uživatele.','err'); return; }
      if(!await askYes('Obnovit data ze zálohy? Přepíše se to všem uživatelům.',{title:'Obnova ze zálohy',ok:'Obnovit',danger:true})) return;
      S=migrate(Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),d));
      me=S.users.find(u=>u.login===me.login)||S.users.find(u=>u.role==='admin');
      await save();break;
    }
    case 'reset':{
      if(!P().admin)return;
      if(!await askYes('Opravdu vrátit všechna data do výchozího stavu? Přijdeš o všechny požadavky i nastavení, a to všem uživatelům.',
        {title:'Reset dat',ok:'Resetovat',danger:true})) return;
      S=migrate(JSON.parse(JSON.stringify(DEFAULT_STATE)));
      me=S.users.find(u=>u.login==='norkova');await save();break;
    }
  }
  render();
}

(async()=>{ await ping(); S=await load(); render(); })();
</script>
