<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering — YFAI minimo</title>
<style>
  :root{
    --navy-1:#0f2f5f; --navy-2:#1b4b8f; --panel:#1e4c8a;
    --bg:#f4f6f9; --card:#ffffff; --line:#dde4ec; --text:#16233a; --muted:#6b7a90;
    --teal:#0d7377; --teal-bg:#e4f2f2; --teal-dark:#0a5b5e;
    --green:#1f9254; --green-bg:#e8f6ee; --red:#c0392b; --red-bg:#fdecea;
    --amber:#b7791f; --amber-bg:#fdf3e2; --blue:#2563a8; --blue-bg:#e9f1fb;
    --purple:#6b46c1; --purple-bg:#f0ebfa; --grey:#6b7a90; --grey-bg:#eef1f5;
    --radius:6px; font-synthesis-weight:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:7px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #2a5ea3;outline-offset:1px}
  a{color:#2563a8}

  header{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px;line-height:1.1}
  header .sub{font-size:11.5px;opacity:.72;margin-top:3px}
  .brand{background:#fff;border-radius:8px;padding:9px 14px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.22);flex:none}
  .brand svg{display:block;height:52px;width:auto}
  @media(max-width:640px){header h1{font-size:20px}.brand svg{height:40px}}
  .chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:4px 11px;font-size:11px;white-space:nowrap}
  .chip.teal{background:var(--teal);border-color:var(--teal)}
  .btn-logout{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;font-size:11px;padding:4px 12px}

  .tabbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .tab{background:#eef1f5;color:#41506b;border:1px solid var(--line);font-weight:600}
  .tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tab .cnt{display:inline-block;margin-left:6px;background:rgba(0,0,0,.10);border-radius:10px;padding:0 6px;font-size:10px;font-weight:700}
  .tab.active .cnt{background:rgba(255,255,255,.25)}
  .spacer{margin-left:auto;display:flex;gap:8px}
  .btn-primary{background:var(--navy-2);color:#fff}
  .btn-teal{background:var(--teal);color:#fff;font-weight:700}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-ok{background:var(--green);color:#fff}
  .btn-danger{background:var(--red);color:#fff}

  main{padding:14px 18px 46px;max-width:1560px;margin:0 auto}
  .notice{background:var(--blue-bg);border:1px solid #cbdff5;border-radius:var(--radius);padding:9px 12px;margin-bottom:12px;font-size:12px;color:#28456e}
  .notice.warn{background:var(--amber-bg);border-color:#f2dfb8;color:#7a5410}
  .notice.demo{background:#fff4e5;border-color:#ffd9a8;color:#8a4b09;display:flex;gap:10px;align-items:flex-start}
  .notice.demo b{white-space:nowrap}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
  .kcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--grey);border-radius:var(--radius);padding:11px 13px}
  .kcard.ok{border-left-color:var(--green)} .kcard.warn{border-left-color:var(--amber)}
  .kcard.bad{border-left-color:var(--red)} .kcard.info{border-left-color:var(--teal)}
  .kcard .lbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kcard .val{font-size:27px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .kcard .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
  .kcard .note{font-size:11px;color:var(--muted)}
  .kcard .note .up{color:var(--red);font-weight:700}
  .kcard .note .down{color:var(--green);font-weight:700}
  .spark{display:block;margin-top:6px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .panel > h2{background:var(--panel);color:#fff;margin:0;font-size:13px;font-weight:700;padding:9px 13px;display:flex;align-items:center;gap:10px}
  .panel > h2 .right{margin-left:auto;font-weight:500;font-size:11px;opacity:.85;display:flex;gap:8px;align-items:center}
  .panel > h2 .right button{padding:3px 9px;font-size:11px}
  .panel .body{padding:13px}
  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
  @media(max-width:1100px){.grid2{grid-template-columns:1fr}}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:#fafbfd}
  .filters input,.filters select{width:auto;min-width:132px}
  .filters .grow{flex:1;min-width:190px}
  label.check{display:flex;gap:6px;align-items:center;font-size:12px;color:#41506b;white-space:nowrap;cursor:pointer}
  label.check input{width:auto}

  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
  thead th{background:#16355f;color:#fff;text-align:left;padding:8px 10px;font-size:10px;letter-spacing:.6px;text-transform:uppercase}
  tbody td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:top;background:var(--row,transparent)}
  tbody tr:hover td{filter:brightness(.975)}
  tr.crit td{background:#f8d2ce}
  tr.crit td:first-child{box-shadow:inset 4px 0 0 var(--red)}
  tr.clickable{cursor:pointer}
  td.desc{white-space:normal;min-width:210px;max-width:340px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .empty{padding:26px;text-align:center;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);background:#fff;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:22px;height:11px;border-radius:3px;border:1px solid var(--line);margin-right:5px;vertical-align:-2px;font-style:normal}

  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .b-grey{background:var(--grey-bg);color:#4a5a70;border-color:#dfe4ea}
  .b-blue{background:var(--blue-bg);color:var(--blue);border-color:#cbdff5}
  .b-amber{background:var(--amber-bg);color:var(--amber);border-color:#f2dfb8}
  .b-green{background:var(--green-bg);color:var(--green);border-color:#c4e6d3}
  .b-green-dark{background:#157347;color:#fff;border-color:#0f5c37}
  .b-purple{background:var(--purple-bg);color:var(--purple);border-color:#ddd2f5}
  .b-red{background:var(--red-bg);color:var(--red);border-color:#f5cfca}
  .b-teal{background:var(--teal-bg);color:var(--teal-dark);border-color:#bfdedd}

  .bar{height:8px;background:#eef1f5;border-radius:5px;overflow:hidden;min-width:70px;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--teal)}
  .bar.late i{background:var(--red)}
  .barwrap{display:flex;align-items:center;gap:7px}
  .barwrap span{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);width:32px;text-align:right}

  .newbar{margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap}
  .btn-new{background:linear-gradient(180deg,#0d7377,#0a5b5e);color:#fff;font-size:16px;font-weight:800;padding:14px 28px;border-radius:10px;
    box-shadow:0 4px 14px rgba(13,115,119,.35);letter-spacing:.3px;text-transform:uppercase}
  .btn-new:hover{background:linear-gradient(180deg,#0a5b5e,#084a4c)}
  .btn-new.orange{background:linear-gradient(180deg,#f6821f,#e8590c);box-shadow:0 4px 14px rgba(232,89,12,.35)}
  .btn-new.orange:hover{background:linear-gradient(180deg,#e8590c,#c94f0a)}

  /* analýzy — karty */
  .anlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .anl{background:#fff;border:1px solid var(--line);border-top:4px solid var(--grey);border-radius:var(--radius);padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
  .anl:hover{box-shadow:0 4px 14px rgba(16,35,58,.10)}
  .anl.s-open{border-top-color:var(--red)} .anl.s-work{border-top-color:var(--amber)}
  .anl.s-check{border-top-color:var(--blue)} .anl.s-done{border-top-color:var(--green)}
  .anl .top{display:flex;align-items:center;gap:8px}
  .anl .no{font-weight:800;color:var(--teal-dark);font-variant-numeric:tabular-nums}
  .anl .ttl{font-size:14px;font-weight:700;line-height:1.3}
  .anl .meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .anl .foot{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);border-top:1px dotted var(--line);padding-top:7px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:1040px;margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h3{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:14px 18px;font-size:17px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px}
  .modal h3 .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px}
  .form{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:12.5px;font-weight:700;color:#41506b}
  .f .req{color:var(--red)}
  .f.span2{grid-column:span 2}.f.span3{grid-column:span 3}.f.span4{grid-column:span 4}
  .f .ro{background:#fafbfd;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;min-height:33px;white-space:pre-wrap}
  .modal .foot{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#fafbfd;border-radius:0 0 10px 10px;flex-wrap:wrap}
  .modal .foot .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .sect{grid-column:span 4;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--teal-dark);border-bottom:2px solid var(--teal-bg);padding-bottom:5px;margin-top:4px}
  .why{grid-column:span 4;display:flex;flex-direction:column;gap:8px}
  .why .row{display:flex;gap:10px;align-items:flex-start}
  .why .n{flex:none;width:74px;font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:4px;padding:6px 8px;text-align:center}
  .why .n.root{background:var(--red)}
  .why .t{flex:1;background:#fafbfd;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;white-space:pre-wrap}
  .hist{padding:0 18px 14px;font-size:11px;color:var(--muted)}
  .hist div{padding:3px 0;border-top:1px dotted var(--line)}

  /* import */
  .steps{display:flex;gap:0;align-items:stretch;padding:0;margin:0 0 14px;list-style:none;flex-wrap:wrap}
  .steps li{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-right:0;padding:10px 14px;font-size:12px;color:var(--muted);display:flex;gap:9px;align-items:center}
  .steps li:first-child{border-radius:var(--radius) 0 0 var(--radius)}
  .steps li:last-child{border-right:1px solid var(--line);border-radius:0 var(--radius) var(--radius) 0}
  .steps li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--grey-bg);color:#4a5a70;display:flex;align-items:center;justify-content:center;font-size:11px}
  .steps li.on{background:var(--teal-bg);color:var(--teal-dark);font-weight:700;border-color:#bfdedd}
  .steps li.on b{background:var(--teal);color:#fff}
  .steps li.done b{background:var(--green);color:#fff}
  .drop{border:2px dashed #b9c8da;border-radius:10px;background:#fbfcfe;padding:34px 20px;text-align:center;color:var(--muted)}
  .drop.hot{border-color:var(--teal);background:var(--teal-bg)}
  .drop .big{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
  .drop .hint{font-size:12px;margin-top:8px}
  .maptbl td{white-space:normal}
  .maptbl select{min-width:190px}
  .ok-line{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:700}
  .file{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;margin-bottom:12px}
  .file .nm{font-weight:700} .file .sz{color:var(--muted);font-size:11px}

  /* grafy */
  .chart{width:100%;height:auto;display:block;overflow:visible}
  .chart text{font-family:inherit}
  .ax{font-size:10px;fill:var(--muted)}
  .gridline{stroke:#eef1f5;stroke-width:1}
  .tip{position:fixed;pointer-events:none;background:#16233a;color:#fff;font-size:11.5px;padding:6px 9px;border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:90;opacity:0;transition:opacity .1s;max-width:250px}
  .tip b{display:block;font-size:12px;margin-bottom:2px}
  .chartlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
  .chartlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;font-style:normal}
  .chartlegend i.line{height:0;border-top:2px dashed var(--navy-2);border-radius:0;width:16px;vertical-align:3px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand"></div>
  <div>
    <h1>Engineering — řízení oddělení</h1>
    <div class="sub">Prostoje · analýzy problémů · akční plány · KPI &nbsp;|&nbsp; YFAI minimo</div>
  </div>
  <div class="chips">
    <span class="chip">Závod: Přeštice</span>
    <span class="chip teal">David Varhaník · manažer</span>
    <button class="btn-logout">Odhlásit</button>
  </div>
</header>

<nav class="tabbar" id="tabbar"></nav>

<main id="main"></main>

<div class="tip" id="tip"></div>

<script>
/* ==========================================================
   Engineering — GRAFICKÝ NÁVRH (klikací maketa)
   Zatím BEZ Firebase: data jsou ukázková, drží se v paměti.
   Až návrh odsouhlasíme, napojí se stejné obrazovky na Firestore.
   ========================================================== */

function logoSvg(){
  return `<svg viewBox="0 0 300 138" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="YFAI minimo">
    <defs>
      <pattern id="yfai-stripes" patternUnits="userSpaceOnUse" x="0" y="8" width="10" height="9.8">
        <rect x="0" y="0" width="10" height="5.9" fill="#1f66b5"/>
      </pattern>
    </defs>
    <text x="150" y="86" text-anchor="middle" fill="url(#yfai-stripes)"
      font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="108"
      textLength="244" lengthAdjust="spacingAndGlyphs">YFAI</text>
    <text x="150" y="128" text-anchor="middle" fill="#111418"
      font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="42"
      letter-spacing="1" textLength="246" lengthAdjust="spacingAndGlyphs">minimo</text>
  </svg>`;
}
document.getElementById('brand').innerHTML = logoSvg();

/* ---------- ukázková data ---------- */

const LINES = ['Lis 400 t','Montážní linka A','Montážní linka B','Svařovna R2','CNC 03','Lakovna'];
const REASONS = [
  {code:'M01', cat:'Porucha stroje',    name:'Porucha — mechanika'},
  {code:'M02', cat:'Porucha stroje',    name:'Porucha — elektro / senzor'},
  {code:'P01', cat:'Přestavba',         name:'Přestavba / seřízení'},
  {code:'L01', cat:'Materiál',          name:'Chybí materiál'},
  {code:'Q01', cat:'Kvalita',           name:'Zmetkovitost — doladění'},
  {code:'H01', cat:'Lidé',              name:'Chybí operátor'},
  {code:'U01', cat:'Údržba',            name:'Plánovaná údržba'}
];

let DOWNTIME = [
  {id:1, date:'2026-08-20', shift:'R', line:'Lis 400 t',        from:'06:42', to:'08:05', min:83, code:'M01', desc:'Prasklá pružina vyhazovače, výměna + seřízení', anl:'ANL-2026-014', src:'Symestic'},
  {id:2, date:'2026-08-20', shift:'R', line:'Montážní linka A', from:'09:10', to:'09:34', min:24, code:'L01', desc:'Chybí konektory 4pin — doběh ze skladu',        anl:'', src:'Symestic'},
  {id:3, date:'2026-08-20', shift:'O', line:'Svařovna R2',      from:'15:20', to:'16:48', min:88, code:'M02', desc:'Výpadek svařovacího zdroje, reset + kontrola',  anl:'ANL-2026-016', src:'Symestic'},
  {id:4, date:'2026-08-19', shift:'R', line:'CNC 03',           from:'07:05', to:'07:41', min:36, code:'P01', desc:'Přestavba na díl 4419-B',                       anl:'', src:'Symestic'},
  {id:5, date:'2026-08-19', shift:'O', line:'Montážní linka B', from:'14:02', to:'16:15', min:133,code:'M01', desc:'Zaseknutý dopravník, poškozený řetěz',          anl:'ANL-2026-015', src:'Symestic'},
  {id:6, date:'2026-08-19', shift:'N', line:'Lakovna',          from:'22:30', to:'23:12', min:42, code:'Q01', desc:'Nedostatečné krytí, doladění trysek',           anl:'', src:'Symestic'},
  {id:7, date:'2026-08-18', shift:'R', line:'Lis 400 t',        from:'10:15', to:'11:52', min:97, code:'M01', desc:'Opakovaně pružina vyhazovače — 3. výskyt',      anl:'ANL-2026-014', src:'Symestic'},
  {id:8, date:'2026-08-18', shift:'O', line:'Montážní linka A', from:'13:40', to:'14:02', min:22, code:'H01', desc:'Chybí operátor na stanici 3',                   anl:'', src:'ruční'},
  {id:9, date:'2026-08-18', shift:'N', line:'CNC 03',           from:'02:10', to:'03:35', min:85, code:'M02', desc:'Chyba osy Z — havarijní zastavení',             anl:'ANL-2026-017', src:'Symestic'},
  {id:10,date:'2026-08-17', shift:'R', line:'Svařovna R2',      from:'08:00', to:'08:55', min:55, code:'U01', desc:'Plánovaná údržba — výměna hořáku',              anl:'', src:'Symestic'},
  {id:11,date:'2026-08-17', shift:'O', line:'Montážní linka B', from:'17:25', to:'18:00', min:35, code:'L01', desc:'Chybí těsnění — zpožděná dodávka',              anl:'', src:'Symestic'},
  {id:12,date:'2026-08-17', shift:'R', line:'Lakovna',          from:'11:05', to:'11:40', min:35, code:'P01', desc:'Změna odstínu — proplach',                       anl:'', src:'Symestic'}
];

const ANALYSES = [
  {no:'ANL-2026-014', ttl:'Opakovaná porucha vyhazovače na lisu 400 t', line:'Lis 400 t', status:'v řešení', owner:'M. Kolář',
   opened:'2026-08-18', loss:180, cat:'Porucha stroje', actions:4, done:1,
   detail:'Za 14 dní 3× prasklá pružina vyhazovače. Celkem 180 min prostoje, 2× zastavená dodávka na zákazníka.',
   immediate:'Výměna pružiny ze skladu, kontrola nastavení zdvihu, dočasně snížena rychlost o 8 %.',

/* ---------- grafy (vlastní SVG, žádné knihovny) ---------- */

function paretoChart(){
  const sums = {};
  DOWNTIME.forEach(d => { const r = reason(d.code); sums[r.cat] = (sums[r.cat]||0) + d.min; });
  const rows = Object.entries(sums).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const total = rows.reduce((s,r)=>s+r.v,0);
  let acc = 0; rows.forEach(r => { acc += r.v; r.cum = acc/total*100; });

  const W=680, H=250, ml=46, mr=44, mt=14, mb=54;
  const iw = W-ml-mr, ih = H-mt-mb;
  const max = Math.max(...rows.map(r=>r.v));
  const step = iw/rows.length, bw = Math.min(64, step-16);

  let g = '';
  for(let i=0;i<=4;i++){ const y = mt+ih - ih*i/4;
    g += `<line class="gridline" x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}"/>
          <text class="ax" x="${ml-7}" y="${y+3}" text-anchor="end">${fmt(Math.round(max*i/4))}</text>
          <text class="ax" x="${ml+iw+7}" y="${y+3}">${i*25} %</text>`; }

  let bars = '', pts = [];
  rows.forEach((r,i)=>{
    const h = ih*r.v/max, x = ml + step*i + (step-bw)/2, y = mt+ih-h;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="#0d7377"
              data-t="<b>${esc(r.k)}</b>${fmt(r.v)} min · ${(r.v/total*100).toFixed(0)} % z celku" class="mk"/>`;
    bars += `<text class="ax" x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-weight="700" fill="#16233a">${fmt(r.v)}</text>`;
    const label = r.k.length>13 ? r.k.slice(0,12)+'…' : r.k;
    bars += `<text class="ax" x="${x+bw/2}" y="${mt+ih+16}" text-anchor="middle">${esc(label)}</text>`;
    bars += `<text class="ax" x="${x+bw/2}" y="${mt+ih+30}" text-anchor="middle" opacity=".75">${(r.v/total*100).toFixed(0)} %</text>`;
    pts.push([x+bw/2, mt+ih - ih*r.cum/100, r]);
  });
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="#1b4b8f" stroke-width="2"
      data-t="<b>${esc(p[2].k)}</b>kumulativně ${p[2].cum.toFixed(0)} %" class="mk"/>`).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Paretova analýza prostojů podle kategorie">
    ${g}${bars}
    <path d="${line}" fill="none" stroke="#1b4b8f" stroke-width="2" stroke-dasharray="5 3"/>
    ${dots}
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#c8d3e0"/>
  </svg>
  <div class="chartlegend"><span><i style="background:#0d7377"></i>minuty prostoje</span>
  <span><i class="line"></i>kumulativní podíl</span></div>`;
}

function trendChart(){
  const W=680, H=230, ml=46, mr=16, mt=14, mb=34;
  const iw = W-ml-mr, ih = H-mt-mb;
  const max = 3000, step = iw/(TREND.length-1);
  let g='';
  for(let i=0;i<=3;i++){ const y = mt+ih - ih*i/3;
    g += `<line class="gridline" x1="${ml}" y1="${y}" x2="${ml+iw}" y2="${y}"/>
          <text class="ax" x="${ml-7}" y="${y+3}" text-anchor="end">${fmt(Math.round(max*i/3))}</text>`; }
  const pts = TREND.map((t,i)=>[ml+step*i, mt+ih-ih*t.min/max, t]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L ${ml+iw} ${mt+ih} L ${ml} ${mt+ih} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:4.5}"
      fill="${i===pts.length-1?'#0d7377':'#fff'}" stroke="#0d7377" stroke-width="2" class="mk"
      data-t="<b>Týden ${esc(p[2].w)}</b>${fmt(p[2].min)} min prostoje · dostupnost ${String(p[2].avail).replace('.',',')} %"/>`).join('');
  const lbl = TREND.map((t,i)=>`<text class="ax" x="${ml+step*i}" y="${mt+ih+18}" text-anchor="middle">${t.w}</text>`).join('');
  const target = mt+ih-ih*1800/max;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj prostojů po týdnech">
    ${g}
    <path d="${area}" fill="#0d7377" opacity=".12"/>
    <line x1="${ml}" y1="${target}" x2="${ml+iw}" y2="${target}" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text class="ax" x="${ml+iw}" y="${target-6}" text-anchor="end" fill="#b7791f" font-weight="700">cíl 1 800 min/týden</text>
    <path d="${line}" fill="none" stroke="#0d7377" stroke-width="2"/>
    ${dots}${lbl}
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#c8d3e0"/>
  </svg>`;
}

function lineBars(){
  const sums = {};
  DOWNTIME.forEach(d => sums[d.line] = (sums[d.line]||0) + d.min);
  const rows = Object.entries(sums).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const max = Math.max(...rows.map(r=>r.v));
  return rows.map(r=>`
    <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line)">
      <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.k)}</div>
      <div style="flex:1.4;height:14px;background:#eef1f5;border-radius:4px;overflow:hidden;border:1px solid var(--line)">
        <div style="height:100%;width:${(r.v/max*100).toFixed(1)}%;background:#0d7377;border-radius:3px"></div>
      </div>
      <div class="num" style="width:64px;font-weight:700">${fmt(r.v)}<span class="muted" style="font-weight:400"> min</span></div>
    </div>`).join('');
}

function sparkline(vals, color){
  const W=150,H=30,max=Math.max(...vals),min=Math.min(...vals),step=W/(vals.length-1);
  const pts = vals.map((v,i)=>[i*step, H-2 - (H-6)*(v-min)/(max-min||1)]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <path d="${d} L ${W} ${H} L 0 ${H} Z" fill="${color}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${color}"/>
  </svg>`;
}

      <div class="muted">Naimportováno <b>128 prostojů</b> · přeskočeno 11 duplicit · 3 řádky čekají na doplnění kódu.</div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">

    </div>`;
  }

  return DEMO_NOTE + stepsHtml + `

    <h2>Import ze Symesticu<span class="right">krok ${impStep} ze 4</span></h2>

      <tbody>
        <tr><td>21.08.2026 06:05</td><td>D. Varhaník</td><td>Symestic_prostoje_KW34.xlsx</td><td class="num">142</td><td class="num">128</td><td class="num">11</td><td><span class="badge b-green">OK</span></td><td><button class="btn-ghost" style="padding:3px 8px;font-size:11px">Vrátit dávku</button></td></tr>
        <tr><td>14.08.2026 06:11</td><td>D. Varhaník</td><td>Symestic_prostoje_KW33.xlsx</td><td class="num">156</td><td class="num">156</td><td class="num">0</td><td><span class="badge b-green">OK</span></td><td><button class="btn-ghost" style="padding:3px 8px;font-size:11px">Vrátit dávku</button></td></tr>

/* ---------- render ---------- */

function render(){
  renderTabs();
  const m = $('#main');
  m.innerHTML = tab==='dash'?viewDash(): tab==='down'?viewDown(): tab==='anl'?viewAnl():
                tab==='act'?viewAct(): tab==='imp'?viewImp(): viewSet();

  m.querySelectorAll('[data-anl]').forEach(el=>{
    el.onclick = ()=>modalAnl(el.dataset.anl);
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); modalAnl(el.dataset.anl); } };
  });
  m.querySelectorAll('[data-down]').forEach(el=>el.onclick=()=>modalDown(+el.dataset.down));
  m.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{tab='act';render();window.scrollTo(0,0)});
  m.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{tab=el.dataset.goto;render();window.scrollTo(0,0)});
  m.querySelectorAll('[data-imp]').forEach(el=>el.onclick=()=>{impStep=+el.dataset.imp;render();window.scrollTo(0,0)});

  const nd = $('#btnNewDown'); if(nd) nd.onclick = ()=>alert('Tady se otevře formulář pro ruční zápis prostoje (pro případy, které Symestic nezachytí).');
  const na = $('#btnNewAnl');  if(na) na.onclick = ()=>alert('Tady se otevře prázdná analýza: popis problému, okamžité opatření, 5× Proč, kořenová příčina, opatření.');
  const nk = $('#btnNewAct');  if(nk) nk.onclick = ()=>alert('Tady se otevře formulář nového úkolu: co, kdo, do kdy, priorita, vazba na analýzu.');

  const drop = $('#drop');
  if(drop){
    const fi = $('#fileInput');
    $('#pick').onclick = ()=>fi.click();
    fi.onchange = ()=>{ if(fi.files[0]){ impFile = fi.files[0].name; impStep=2; render(); } };
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add('hot')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove('hot')}));
    drop.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f){ impFile=f.name; impStep=2; render(); } });
  }

  m.querySelectorAll('.mk').forEach(el=>{
    el.style.cursor='pointer';
    el.addEventListener('mousemove', e=>tipShow(e, el.dataset.t));
    el.addEventListener('mouseleave', tipHide);
  });
}

render();
</script>
</body>
</html>
